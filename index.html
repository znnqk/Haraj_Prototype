:root{--navy:#14233d;--blue:#1449c5;--blue2:#0e3696;--paper:#f4f6fa;--muted:#4e5d73;--line:#dce3ef;--soft:#eaf0ff;--white:#fff;--mint:#bdeedd}

function match(){const q=filters.q.trim().toLowerCase().split(/\s+/).filter(Boolean);const r=cars.filter(c=>q.every(w=>c.title.toLowerCase().includes(w))&&(!filters.city||c.city===filters.city)&&(!filters.year||c.year>=Number(filters.year))&&(!filters.fuel||c.fuel===filters.fuel)&&((!filters.min&&!filters.max)||(c.price!==null&&(!filters.min||c.price>=Number(filters.min))&&(!filters.max||c.price<=Number(filters.max)))));if(sorting!=='recent')r.sort((a,b)=>a.price===null?1:b.price===null?-1:sorting==='lo'?a.price-b.price:b.price-a.price);return r}
function home(){return '<section class="hero"><div class="hero-copy"><div class="kicker">سوق السيارات المستعملة</div><h1>ابحث عن سيارتك القادمة</h1><p>حدّد المدينة والميزانية، ثم قارن العروض جنبًا إلى جنب.</p><form id="searchform" class="searchform"><label>اسم السيارة<input name="q" class="field" placeholder="مثال: كامري"></label><label>المدينة<select name="city" class="field">'+cityOptions('')+'</select></label><button class="button primary">بحث</button></form></div><div class="hero-image">'+photo(cars[3])+'<span>صورة من إعلان سيارة</span></div></section><div class="sectiontitle"><div><h2>سيارات متاحة للتصفح</h2><p>تصفح التفاصيل أو أضف سيارة إلى المقارنة.</p></div><a class="button" href="#results">عرض السيارات</a></div><div class="grid">'+cars.slice(0,3).map(card).join('')+'</div>'+tray()}

function route(focus=true){if(dialog.open)dialog.close();const [screen,id]=location.hash.slice(1).split('/');active=['home','results','compare','detail'].includes(screen)?screen:'home';if(active==='detail'){detail=cars.some(c=>c.id===id)?id:'white';imageIndex=0}render(focus)}
let updateId=0;
function update(next,focusSelector){filters=next;pending=true;const id=++updateId;render(false);setTimeout(()=>{if(id!==updateId)return;pending=false;if(active!=='results')return;render(false);const focus=main.querySelector(focusSelector||'#page-title');if(focus){if(focus.tagName==='H1')focus.tabIndex=-1;focus.focus({preventScroll:true})}say('عدد النتائج: '+match().length)},320)}
main.addEventListener('submit',e=>{e.preventDefault();const f=e.target;const data=Object.fromEntries(new FormData(f));for(const k in data)data[k]=data[k].trim();if(f.id==='searchform'){filters={...defaults,...data};go('results');return}if(f.id!=='filters')return;const bad=[f.elements.min,f.elements.max].find(i=>!i.validity.valid);if(bad||(data.min&&data.max&&Number(data.min)>Number(data.max))){const el=f.querySelector('#filter-error');el.hidden=false;el.textContent=bad?'أدخل سعرًا صحيحًا يساوي صفرًا أو أكثر.':'الحد الأعلى يجب أن يساوي الحد الأدنى أو يزيد عنه.';const input=bad||f.elements.max;input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','filter-error');input.focus();return}update({...defaults,...data})});
main.addEventListener('change',e=>{if(e.target.id==='sort'){sorting=e.target.value;render(false);main.querySelector('#sort').focus();say('تم تغيير ترتيب النتائج')}});
main.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.hasAttribute('data-clear')){update({...defaults});return}
if(b.dataset.drop){update({...filters,[b.dataset.drop]:''});return}
if(b.dataset.pick){const id=b.dataset.pick;const was=selected.includes(id);if(!was&&selected.length===2){say('المقارنة ممتلئة. أزل سيارة قبل إضافة أخرى.',true);return}selected=was?selected.filter(x=>x!==id):[...selected,id];render(false);(main.querySelector('[data-pick="'+id+'"]')||main.querySelector('.state a'))?.focus({preventScroll:true});say(was?'أزيلت السيارة من المقارنة':'أضيفت السيارة إلى المقارنة',true);return}
if(b.dataset.photo!==undefined){imageIndex=Number(b.dataset.photo);render(false);main.querySelector('[data-photo="'+imageIndex+'"]').focus({preventScroll:true});say('الصورة '+(imageIndex+1));return}
if(b.id==='open-dialog'){lastContact=b;dialog.showModal();dialog.querySelector('textarea').focus()}});
dialog.querySelector('#close-dialog').onclick=()=>dialog.close();
dialog.querySelector('form').onsubmit=e=>{e.preventDefault();if(!dialog.querySelector('textarea').value.trim())return;dialog.close();dialog.querySelector('form').reset();say('تمت معاينة الرسالة. لم تُرسل إلى البائع.',true)};
dialog.addEventListener('close',()=>{if(lastContact?.isConnected)lastContact.focus()});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus()});
window.addEventListener('hashchange',()=>route(true));
route(false);
</script></body></html>
